# 影视AI配音平台 - Docker Compose 配置
# Version: 2.0
# 支持多环境配置和资源限制

version: '3.9'

# ============================================
# 网络配置
# ============================================
networks:
  film-dubbing-network:
    name: film-dubbing-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================
# 卷配置
# ============================================
volumes:
  postgres_data:
    name: film-dubbing-postgres-data
  redis_data:
    name: film-dubbing-redis-data
  minio_data:
    name: film-dubbing-minio-data
  artifact_data:
    name: film-dubbing-artifact-data
  upload_data:
    name: film-dubbing-upload-data
  model_data:
    name: film-dubbing-model-data
  log_data:
    name: film-dubbing-log-data
  celerybeat_schedule:
    name: film-dubbing-celbyat-schedule

# ============================================
# 服务配置
# ============================================
services:
  # ============================================
  # PostgreSQL 数据库
  # ============================================
  postgres:
    image: postgres:15-alpine
    container_name: film-dubbing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filmdubbing}
      POSTGRES_USER: ${POSTGRES_USER:-filmdubbing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filmdubbing_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql  # 初始化脚本
    networks:
      - film-dubbing-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filmdubbing} -d ${POSTGRES_DB:-filmdubbing}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================
  # Redis 缓存
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: film-dubbing-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - film-dubbing-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ============================================
  # MinIO 对象存储
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: film-dubbing-minio
    restart: unless-stopped
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_DEFAULT_BUCKETS: artifacts,uploads,models,exports
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - film-dubbing-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # MinIO 客户端（用于初始化 bucket）
  # ============================================
  minio-init:
    image: minio/mc:latest
    container_name: film-dubbing-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set minio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123}; do echo "Waiting for MinIO..."; sleep 1; done
        mc mb minio/artifacts || true
        mc mb minio/uploads || true
        mc mb minio/models || true
        mc mb minio/exports || true
        echo "MinIO buckets initialized"
    networks:
      - film-dubbing-network

  # ============================================
  # Layer 0 API
  # ============================================
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: ${BUILD_TARGET:-production}  # development | production
      args:
        BUILD_DATE: ${BUILD_DATE}
        VCS_REF: ${VCS_REF}
        VERSION: ${VERSION}
    image: film-dubbing-api:${VERSION:-latest}
    container_name: film-dubbing-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # 数据库
      - DATABASE_URL=postgresql://${POSTGRES_USER:-filmdubbing}:${POSTGRES_PASSWORD:-filmdubbing_password}@postgres:5432/${POSTGRES_DB:-filmdubbing}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_USE_HTTPS=0
      # 应用配置
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      # Worker 配置
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./src:/app/src:ro  # 只读挂载生产环境
      - artifact_data:/app/artifacts
      - upload_data:/app/uploads
      - model_data:/app/models
      - log_data:/app/logs
    networks:
      - film-dubbing-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 512M
      replicas: ${API_REPLICAS:-1}

  # ============================================
  # CPU Worker
  # ============================================
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    image: film-dubbing-api:${VERSION:-latest}
    container_name: film-dubbing-worker
    restart: unless-stopped
    command: celery -A src.worker worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4}
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-filmdubbing}:${POSTGRES_PASSWORD:-filmdubbing_password}@postgres:5432/${POSTGRES_DB:-filmdubbing}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_USE_HTTPS=0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - WORKER_TYPE=cpu
    volumes:
      - ./src:/app/src
      - artifact_data:/app/artifacts
      - upload_data:/app/uploads
      - model_data:/app/models
      - log_data:/app/logs
    networks:
      - film-dubbing-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.worker inspect ping"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '8.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 1G
      replicas: ${CPU_WORKER_REPLICAS:-1}

  # ============================================
  # GPU Worker (需要 nvidia-docker)
  # ============================================
  gpu-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    image: film-dubbing-gpu-worker:${VERSION:-latest}
    container_name: film-dubbing-gpu-worker
    restart: unless-stopped
    runtime: nvidia  # 需要 nvidia-docker2
    environment:
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-0}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-filmdubbing}:${POSTGRES_PASSWORD:-filmdubbing_password}@postgres:5432/${POSTGRES_DB:-filmdubbing}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - WORKER_TYPE=gpu
    command: celery -A src.worker worker --loglevel=info --concurrency=1 -Q gpu,tts
    volumes:
      - ./src:/app/src
      - artifact_data:/app/artifacts
      - model_data:/app/models
      - log_data:/app/logs
    networks:
      - film-dubbing-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - gpu  # 默认不启动，需要显式启用: docker-compose --profile gpu up

  # ============================================
  # Celery Beat (调度器)
  # ============================================
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    image: film-dubbing-api:${VERSION:-latest}
    container_name: film-dubbing-beat
    restart: unless-stopped
    command: celery -A src.worker beat --loglevel=info --schedulerfile /app/celerybeat-schedule
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-filmdubbing}:${POSTGRES_PASSWORD:-filmdubbing_password}@postgres:5432/${POSTGRES_DB:-filmdubbing}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - celerybeat_schedule:/app/celerybeat-schedule
    networks:
      - film-dubbing-network
    depends_on:
      - redis

  # ============================================
  # Flower (Celery 监控)
  # ============================================
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: production
    image: film-dubbing-api:${VERSION:-latest}
    container_name: film-dubbing-flower
    restart: unless-stopped
    command: celery -A src.worker flower --port=5555 --broker=redis://redis:6379/0
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - film-dubbing-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5555"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - monitoring  # 需要显式启用: docker-compose --profile monitoring up

  # ============================================
  # Nginx (反向代理)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: film-dubbing-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - upload_data:/var/www/uploads:ro
    networks:
      - film-dubbing-network
    depends_on:
      - api
    profiles:
      - nginx  # 需要显式启用

  # ============================================
  # Web Backend (FastAPI)
  # ============================================
  web-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: film-dubbing-web-backend:${VERSION:-latest}
    container_name: film-dubbing-web-backend
    restart: unless-stopped
    ports:
      - "${WEB_BACKEND_PORT:-8001}:8000"
    environment:
      # 数据库
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-filmdubbing}:${POSTGRES_PASSWORD:-filmdubbing_password}@postgres:5432/${POSTGRES_DB:-filmdubbing}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # MinIO
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_USE_HTTPS=0
      # 应用配置
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DEBUG=${DEBUG:-0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
      # 认证（本地免登录模式：AUTH_DISABLED=true 时无需登录）
      - AUTH_DISABLED=${AUTH_DISABLED:-false}
    volumes:
      - ./src:/app/src:ro
      - artifact_data:/app/artifacts
      - upload_data:/app/uploads
      - model_data:/app/models
      - log_data:/app/logs
    networks:
      - film-dubbing-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  # ============================================
  # Frontend (React + Vite)
  # ============================================
  web-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      # 前端默认走同源相对路径 /api/v1（经 nginx 反代后端），无需注入绝对地址
      args: {}
    image: film-dubbing-web-frontend:${VERSION:-latest}
    container_name: film-dubbing-web-frontend
    restart: unless-stopped
    ports:
      - "${WEB_FRONTEND_PORT:-3000}:80"
    networks:
      - film-dubbing-network
    depends_on:
      - web-backend
    healthcheck:
      # 经 nginx 代理验证整条链路（/health 在后端无路由返回 404，改用 /api/v1/health）
      test: ["CMD", "curl", "-f", "http://localhost/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
