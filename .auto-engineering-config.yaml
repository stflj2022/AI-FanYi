# AI-FanYi 自动化工程开发配置
# 供 auto-engineering-workflow skill 的 Phase 1-3 使用（无人值守系统配置在 scripts/install-unattended.sh）

repository:
  owner: "stflj2022"
  repo: "AI-FanYi"
  branch: "main"

git:
  target:
    remote: "origin"
    branch: "main"

matt_skills:
  issue_tracker: "local"
  triage_labels:
    - "feature"
    - "bug"
    - "refactor"
  docs_path: "docs"
  adr_path: "docs/adr"

code_review:
  pre_commit_required: true
  max_review_attempts: 3
  fail_on_any_finding: false
  auto_fix_minor_issues: true

user_confirmation:
  download_retry_count: 10
  first_response_timeout_minutes: 20
  retry_interval_hours: 1
  max_retry_cycles: 3

unattended:
  install_script: "scripts/install-unattended.sh"
  driver_service: "aifanyi-driver.service"
  web_ui_driver_service: "web-ui-driver.service"
  watchdog_timer: "aifanyi-watchdog.timer"
  progress_report_timer: "aifanyi-progress-report.timer"
  completion_check: "scripts/completion-check.sh"
  shutdown_script: "scripts/shutdown-unattended.sh"
  main_tickets_dir: "docs/tickets"
  web_ui_tickets_dir: ".scratch/web-ui-tickets"
  driver_log: ".claude/pi-driver.log"
  web_ui_driver_log: ".claude/web-ui-driver.log"
  progress_report_log: ".claude/progress-report.log"
  progress_report_interval_minutes: 30
  watchdog_interval_minutes: 10
  notification_enabled: true
